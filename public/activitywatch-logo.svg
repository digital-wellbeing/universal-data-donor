<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="ActivityWatch">
  <circle cx="60" cy="60" r="52" fill="#242450"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="#5C5CD6" stroke-width="4"/>
  <circle cx="60" cy="60" r="40" fill="none" stroke="#8A8AF0" stroke-width="2" opacity="0.5"/>
  <!-- clock hands -->
  <line x1="60" y1="60" x2="60" y2="30" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="84" y2="72" stroke="#8A8AF0" stroke-width="5" stroke-linecap="round"/>
  <circle cx="60" cy="60" r="5" fill="#FFFFFF"/>
  <!-- tick marks -->
  <g fill="#8A8AF0">
    <rect x="58" y="14" width="4" height="8" rx="2"/>
    <rect x="58" y="98" width="4" height="8" rx="2"/>
    <rect x="14" y="58" width="8" height="4" rx="2"/>
    <rect x="98" y="58" width="8" height="4" rx="2"/>
  </g>
</svg>
