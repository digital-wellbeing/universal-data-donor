services:
  datadonation-api:
    build: .
    image: datadonation-api:latest
    container_name: datadonation-api
    restart: unless-stopped
    # Bind to localhost only — Caddy reverse-proxies /datadonation/submit to it.
    ports:
      - "127.0.0.1:8083:8083"
    # SQLite donations DB persists here on the host.
    volumes:
      - /srv/datadonation-data:/data
    # Least privilege: read-only root fs, no extra capabilities, no setuid.
    read_only: true
    tmpfs:
      - /tmp   # gunicorn worker heartbeat files
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - datadonation-api.env
